<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDesk Vision Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
            overflow:hidden;
        }

        .background-glow{
            position:absolute;
            width:500px;
            height:500px;
            background:rgba(59,130,246,0.25);
            filter:blur(120px);
            border-radius:50%;
            top:-100px;
            right:-100px;
        }

        .login-box{
            position:relative;
            z-index:2;
            width:380px;
            padding:40px;
            border-radius:20px;
            background:rgba(255,255,255,0.06);
            backdrop-filter:blur(14px);
            border:1px solid rgba(255,255,255,0.1);
            box-shadow:0 8px 30px rgba(0,0,0,0.4);
            text-align:center;
        }

        .logo{
            font-size:55px;
            margin-bottom:10px;
        }

        h1{
            color:white;
            margin-bottom:10px;
            font-size:28px;
        }

        .subtitle{
            color:#94a3b8;
            margin-bottom:30px;
            font-size:14px;
        }

        input{
            width:100%;
            padding:14px;
            margin-bottom:18px;
            border:none;
            outline:none;
            border-radius:12px;
            background:rgba(255,255,255,0.08);
            color:white;
            font-size:15px;
        }

        input::placeholder{
            color:#cbd5e1;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#2563eb;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#1d4ed8;
            transform:translateY(-2px);
        }

        .footer-text{
            margin-top:20px;
            color:#94a3b8;
            font-size:12px;
        }

    </style>
</head>

<body>

    <div class="background-glow"></div>

    <div class="login-box">

        <div class="logo">🧠</div>

        <h1>SmartDesk Vision</h1>

        <p class="subtitle">
            AI Powered Desk Monitoring System
        </p>

        <input type="text" id="username" placeholder="Enter Username">

        <input type="password" id="password" placeholder="Enter Password">
        <button type="button" onclick="login()">
           Login to Dashboard
       </button>
        <div class="footer-text">
            Secure AI Monitoring Interface
        </div>

    </div>
<script>

async function login() {

    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    const response = await fetch("/login", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            username: user,
            password: pass
        })

    });

    const data = await response.json();

    if(data.success){

        window.location.href = "/dashboard";

    } else {

        alert("Invalid Credentials");

    }
}

</script>
</body>
</html>
